name: Build Donatil Visuals

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать исходники репозитория
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Собрать мод
        run: gradle build --no-daemon

      - name: Отдать готовый .jar
        uses: actions/upload-artifact@v4
        with:
          name: donatil-visuals-jar
          path: build/libs/*.jar
